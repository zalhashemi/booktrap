# Render blueprint for the BookTrap API (README, "Deploy"). The web app is on Cloudflare Pages.
services:
  - type: web
    name: booktrap-api
    runtime: node
    # Always on, about $7 a month. Free sleeps after 15 minutes idle, which pauses reading and the 6-hourly cleanup.
    plan: starter
    # Same region as the Supabase project (ap-southeast-1, Singapore); it can't be changed later. Every request
    # makes several database round trips.
    region: singapore
    # Dev dependencies are needed to build (tsup), even with NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build -w @booktrap/api
    startCommand: npm start -w @booktrap/api
    # Liveness only: /health/ready reaches the database and is rate limited.
    healthCheckPath: /health
    # Deploy a push to main only once GitHub CI is green.
    autoDeployTrigger: checksPass
    # Only secrets and what differs from the API's defaults (api/src/config.ts) are set here.
    envVars:
      - key: NODE_ENV
        value: production
      # TRUST_PROXY_HOPS defaults to 3 in production, measured on 12 Oct 2026: Render's in-container proxy
      # (the socket), its load balancer (10.x) and Cloudflare in front of Render (162.158.x). It holds only
      # while api.booktrap.app is a DNS-only CNAME (proxying it through our Cloudflare zone adds a hop).
      - key: IP_HASH_KEY
        generateValue: true
      # The hidden admin page's key: copy it from the dashboard to open /admin.
      - key: ADMIN_TOKEN
        generateValue: true
      # Secrets: entered in the Render dashboard, never committed.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
      # The site's origins, comma-separated: https://booktrap.app (and https://booktrap.pages.dev while testing).
      - key: ALLOWED_ORIGIN
        sync: false
      # Posts read at once. Phase 9: Starter (0.5 CPU, 512 MB) is CPU-bound at 2 or more and used
      # 326 MB at 4; 3 covers the waits on Apify and Claude. Raise to 6 on Standard (1 CPU, 2 GB).
      - key: JOB_CONCURRENCY
        value: "3"
